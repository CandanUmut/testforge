name: Tests

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  reporter:
    name: Reporter unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run reporter tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  frontend:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
